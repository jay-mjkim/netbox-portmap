[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-portmap"
version = "0.6.2"
description = "NetBox plugin: map ports between devices visually and create the cables, with media compatibility checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Minjae Kim" }]
keywords = ["netbox", "netbox-plugin", "cabling", "dcim"]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jay-mjkim/netbox-portmap"
Issues = "https://github.com/jay-mjkim/netbox-portmap/issues"

[tool.setuptools.packages.find]
include = ["netbox_portmap*"]

[tool.setuptools.package-data]
netbox_portmap = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
